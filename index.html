<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>JISHENG OS · 工具箱</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    ::selection { background: rgba(255, 255, 255, .12); }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      background: #000;
      color: #e8e6e3;
      line-height: 1.5;
      padding: 4rem 2rem 3rem;
    }

    .header { text-align: center; margin-bottom: 1.5rem; position: relative; }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.15rem;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(2.4rem, 6vw, 4.2rem);
      letter-spacing: -0.03em;
      color: #e8e6e3;
      line-height: 1.1;
    }
    .seal { display: none; }

    .subtitle {
      margin-top: .9rem;
      font-size: .92rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      color: #8a8a87;
    }

    .brush { display: none; }

    /* 装饰线 */
    .list-head { display: flex; align-items: center; justify-content: center; gap: 0; margin: 3.1rem 0 1.9rem; }
    .lh-line { height: 1px; width: min(120px, 14vw); background: linear-gradient(90deg, transparent, #2c2c2a); }
    .lh-line.r { background: linear-gradient(90deg, #2c2c2a, transparent); }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
      gap: 2px;
    }

 
    .tool-card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 212px;
      padding: 1.6rem 1.45rem 1.35rem;
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      text-decoration: none;
      color: #e8e6e3;
      cursor: pointer;
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }

    /* 鼠标跟随光斑 */
    .tool-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(600px circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,0.04), transparent 40%);
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
    }

    .tool-card:hover::before {
      opacity: 1;
    }

    .tool-card:hover {
      background: #111;
      border-color: #2a2a2a;
    }
    .tool-card:focus-visible {
      outline: 1px solid #555;
      outline-offset: 2px;
    }

    .tool-card h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #e8e6e3;
      margin-bottom: .55rem;
      transition: all 0.4s;
    }
    .tool-card:hover h3 {
      letter-spacing: -0.01em;
    }

    .tool-card p {
      font-size: .85rem;
      font-weight: 300;
      line-height: 1.68;
      color: #8a8a87;
      margin-bottom: 1.3rem;
      flex: 1;
      transition: color 0.4s;
    }
    .tool-card:hover p {
      color: #ababa8;
    }

    .tool-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      border-top: 1px solid #141414;
      padding-top: .85rem;
    }

    .open-arrow {
      display: inline-flex;
      color: #4a4a48;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      transform: translateY(8px);
      opacity: 0;
    }
    .open-arrow svg { width: 18px; height: 18px; }
    .tool-card:hover .open-arrow {
      transform: translateY(0);
      opacity: 1;
      color: #999997;
    }

    .page-foot { margin-top: 3.8rem; text-align: center; }
    .foot-mark { display: none; }
    .page-foot p {
      font-size: .78rem;
      font-weight: 300;
      letter-spacing: .15em;
      color: #5a5a58;
    }

    .noscript-note {
      margin: 2rem auto 0;
      max-width: 520px;
      text-align: center;
      padding: 1.4rem 1.6rem;
      border: 1px solid #1a1a1a;
      background: #0a0a0a;
      color: #7a7a78;
      font-size: .9rem;
      letter-spacing: .08em;
      border-radius: 6px;
    }



    @media (max-width: 700px) {
      body { padding: 2.5rem 1rem 2rem; }
      .tools-grid { grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 2px; }
      .tool-card { padding: 1.35rem 1.2rem 1.15rem; min-height: 196px; }
      .title-row { gap: .8rem; }
      .list-head { margin: 2.4rem 0 1.5rem; }
    }
    @media (max-width: 460px) {
      .tools-grid { grid-template-columns: 1fr; }
      .tool-card { min-height: auto; }
    }
  </style>
</head>
<body>
  <header class="header">
      <div class="title-row">
        <h1>工具</h1>
        <span class="seal" aria-hidden="true">利其器</span>
      </div>
      <p class="subtitle">一站式访问所有实用网页工具 · 点击卡片立即使用</p>
      <svg class="brush" viewBox="0 0 240 16" width="240" height="16" aria-hidden="true">
        <path d="M6 9.5C40 5.5 78 4.5 120 5.5c46 1 82 1.5 112-2" fill="none" stroke="#221b10" stroke-width="3.2" stroke-linecap="round" opacity=".78"></path>
        <path d="M18 12.5c30-2.5 62-3 96-2.6" fill="none" stroke="#221b10" stroke-width="1.4" stroke-linecap="round" opacity=".26"></path>
        <rect x="228" y="4" width="7" height="7" rx="1.5" transform="rotate(45 231.5 7.5)" fill="#b0342a"></rect>
      </svg>
    </header>

    <div class="list-head">
      <span class="lh-line"></span>
      <span class="lh-line r"></span>
    </div>

    <!-- 卡片只由下方脚本生成一次，不再在静态 HTML 里重复一份 -->
    <div class="tools-grid" id="toolsGrid"></div>

    <footer class="page-foot">
      <div class="foot-mark" aria-hidden="true">
        <span class="foot-line"></span>
        <svg width="9" height="9" viewBox="0 0 10 10"><rect x="1.6" y="1.6" width="6.8" height="6.8" rx="1" transform="rotate(45 5 5)" fill="#b0342a"></rect></svg>
        <span class="foot-line"></span>
      </div>
      <p>JISHENG OS · 工欲善其事 必先利其器</p>
    </footer>

  <noscript>
    <div class="noscript-note">
      「 请启用 JavaScript 以查看完整的工具卡片导航 」
    </div>
  </noscript>

  <script>
  (function () {
    function SVG(inner) {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + inner + '</svg>';
    }

    var ARROW = SVG('<path d="M7 17 17 7"/><path d="M9 7h8v8"/>');

    var tools = [
      {
        name: "Markdown 编辑器",
        file: "Markdown 编辑器.html",
        description: "沉浸式 Markdown 书写与实时预览，极简优雅。",
        tag: "写作"
      },
      {
        name: "ZIP 时区修正",
        file: "ZIP时区修正.html",
        description: "批量修正 ZIP 内文件时区，高效准确。",
        tag: "文件处理"
      },
      {
        name: "JISHENG 首页",
        file: "index.html",
        description: "主入口页面，快速导航至所有资源。",
        tag: "导航"
      },
      {
        name: "万能超级工具箱",
        file: "万能超级工具箱.html",
        description: "集成多种实用小工具，一站式解决杂项需求。",
        tag: "合集"
      },
      {
        name: "世界上最好的文字替换工具",
        file: "世界上最好的文字替换工具.html",
        description: "强大文字替换引擎，支持正则与批量处理。",
        tag: "文本"
      },
      {
        name: "差异对比工具",
        file: "差异对比工具.html",
        description: "高亮显示文本/代码差异，快速审阅变更。",
        tag: "对比"
      },
      {
        name: "收藏夹对比同步工具",
        file: "收藏夹对比同步工具.html",
        description: "跨浏览器书签对比，同步去重一步到位。",
        tag: "同步"
      },
      {
        name: "文章多版本对比评审",
        file: "文章多版本对比评审.html",
        description: "多版本内容并行评审，注释与建议清晰。",
        tag: "审阅"
      },
      {
        name: "移动端文字编辑",
        file: "移动端文字编辑.html",
        description: "专为触屏优化的文字编辑面板，简洁顺手。",
        tag: "移动"
      },
      {
        name: "炸字移动端文字编辑",
        file: "炸字移动端文字编辑.html",
        description: "大爆炸式拆字重组，移动端触屏优化的创意文字编辑。",
        tag: "移动"
      },
      {
        name: "图片元数据擦除查看",
        file: "图片元数据擦除查看.html",
        description: "查看并一键擦除图片 EXIF 元数据，隐私保护一步到位。",
        tag: "隐私"
      },
      {
        name: "入口页管理器",
        file: "入口页管理器.html",
        description: "导入最新入口页，添加与管理工具卡片，一键导出更新版。",
        tag: "管理"
      }
    ];

    var grid = document.getElementById("toolsGrid");
    var countEl = document.getElementById("toolCount");
    if (countEl) countEl.textContent = String(tools.length);

    tools.forEach(function (tool, i) {
      var card = document.createElement("a");
      card.className = "tool-card";
      card.href = tool.file;
      card.setAttribute("aria-label", tool.name);
      card.innerHTML =
        '<h3>' + tool.name + '</h3>' +
        '<p>' + tool.description + '</p>' +
        '<div class="tool-footer">' +
          '<span class="open-arrow">' + ARROW + '</span>' +
        '</div>';

      // 鼠标跟随光斑
      card.addEventListener('mousemove', function (e) {
        var rect = card.getBoundingClientRect();
        var x = ((e.clientX - rect.left) / rect.width) * 100;
        var y = ((e.clientY - rect.top) / rect.height) * 100;
        card.style.setProperty('--mx', x + '%');
        card.style.setProperty('--my', y + '%');
      });

      grid.appendChild(card);
    });
  })();
  </script>
</body>
</html>
