<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>JISHENG OS · 工具箱</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-gradient: linear-gradient(145deg, #0f172a 0%, #1e293b 45%, #0b1120 100%);
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.18);
      --glass-shadow: 0 20px 35px rgba(0, 0, 0, 0.5);
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --accent: #a78bfa;
      --accent-soft: #c4b5fd;
      --cyan: #67e8f9;
      --card-hover-bg: rgba(255, 255, 255, 0.14);
      --radius-xl: 2.5rem;
      --radius-lg: 2rem;
      --radius-md: 1.5rem;
      --radius-sm: 1rem;
    }

    body {
      font-family: 'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      color: var(--text-primary);
      backdrop-filter: blur(2px);
      line-height: 1.5;
    }

    /* 主容器 */
    .main-container {
      width: 100%;
      max-width: 1300px;
      margin: 0 auto;
    }

    /* 头部 */
    .header {
      text-align: center;
      margin-bottom: 3.5rem;
      position: relative;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(167, 139, 250, 0.12);
      border: 1px solid rgba(167, 139, 250, 0.35);
      padding: 0.5rem 1.4rem;
      border-radius: 100px;
      backdrop-filter: blur(12px);
      margin-bottom: 1.5rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      color: #ddd6fe;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .logo-badge span {
      font-size: 1.3rem;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #f8fafc 20%, #c4b5fd 70%, #a5f3fc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.75rem;
      text-shadow: 0 0 25px rgba(167, 139, 250, 0.25);
    }

    .subtitle {
      font-size: 1.2rem;
      color: var(--text-secondary);
      max-width: 550px;
      margin: 0 auto 1rem;
      font-weight: 400;
      backdrop-filter: blur(4px);
    }

    .header-divider {
      width: 80px;
      height: 4px;
      background: linear-gradient(90deg, #a78bfa, #67e8f9);
      border-radius: 10px;
      margin: 1.5rem auto 0;
      opacity: 0.8;
    }

    /* 工具网格 */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.8rem;
      margin-top: 1rem;
    }

    /* 卡片样式 */
    .tool-card {
      background: var(--glass-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      box-shadow: var(--glass-shadow);
      padding: 1.8rem 1.5rem;
      display: flex;
      flex-direction: column;
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
      cursor: pointer;
      text-decoration: none;
      color: var(--text-primary);
      position: relative;
      overflow: hidden;
      min-height: 190px;
    }

    .tool-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 0% 20%, rgba(167, 139, 250, 0.15), transparent 70%);
      opacity: 0;
      transition: opacity 0.35s ease;
      pointer-events: none;
      border-radius: inherit;
    }

    .tool-card:hover {
      background: var(--card-hover-bg);
      border-color: rgba(255, 255, 255, 0.35);
      transform: translateY(-6px);
      box-shadow: 0 28px 45px rgba(0, 0, 0, 0.6);
    }

    .tool-card:hover::before {
      opacity: 1;
    }

    .card-icon {
      font-size: 2.4rem;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.3));
    }

    .tool-card h3 {
      font-size: 1.45rem;
      font-weight: 600;
      margin-bottom: 0.6rem;
      letter-spacing: -0.01em;
      color: #f8fafc;
      position: relative;
      z-index: 2;
    }

    .tool-card p {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.5;
      margin-bottom: 1.4rem;
      flex: 1;
      position: relative;
      z-index: 2;
      opacity: 0.85;
    }

    .tool-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #a5b4fc;
      font-weight: 500;
      letter-spacing: 0.3px;
      position: relative;
      z-index: 2;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 0.9rem;
      margin-top: auto;
    }

    .tool-footer .tag {
      background: rgba(167, 139, 250, 0.15);
      padding: 0.25rem 0.8rem;
      border-radius: 30px;
      font-size: 0.7rem;
      color: #ddd6fe;
      border: 1px solid rgba(167, 139, 250, 0.3);
    }

    .open-arrow {
      transition: transform 0.2s ease;
      font-size: 1.1rem;
    }

    .tool-card:hover .open-arrow {
      transform: translateX(4px);
    }

    /* 特定卡片颜色点缀 */
    .tool-card:nth-child(1) .card-icon { color: #fcd34d; }
    .tool-card:nth-child(2) .card-icon { color: #a5b4fc; }
    .tool-card:nth-child(3) .card-icon { color: #6ee7b7; }
    .tool-card:nth-child(4) .card-icon { color: #f0abfc; }
    .tool-card:nth-child(5) .card-icon { color: #67e8f9; }
    .tool-card:nth-child(6) .card-icon { color: #fda4af; }
    .tool-card:nth-child(7) .card-icon { color: #c4b5fd; }
    .tool-card:nth-child(8) .card-icon { color: #86efac; }
    .tool-card:nth-child(9) .card-icon { color: #fbbf24; }
    .tool-card:nth-child(10) .card-icon { color: #38bdf8; }
    .tool-card:nth-child(11) .card-icon { color: #fb923c; }
    .tool-card:nth-child(12) .card-icon { color: #e879f9; }
    .tool-card:nth-child(13) .card-icon { color: #a3e635; }
    .tool-card:nth-child(14) .card-icon { color: #f472b6; }

    /* 响应式 */
    @media (max-width: 700px) {
      body {
        padding: 1.5rem 1rem;
      }
      .tools-grid {
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 1.2rem;
      }
      .tool-card {
        padding: 1.4rem 1.2rem;
        min-height: 170px;
      }
      h1 {
        font-size: 2.6rem;
      }
    }

    @media (max-width: 480px) {
      .tools-grid {
        grid-template-columns: 1fr;
      }
      .tool-card {
        min-height: auto;
      }
    }

    /* 装饰性浮动粒子 */
    .bg-decoration {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
      background: radial-gradient(circle at 10% 20%, rgba(167, 139, 250, 0.12) 0%, transparent 30%),
                  radial-gradient(circle at 90% 80%, rgba(103, 232, 249, 0.12) 0%, transparent 30%);
    }
  </style>
</head>
<body>
  <div class="bg-decoration"></div>
  <div class="main-container">
    <!-- 头部 -->
    <header class="header">
      <div class="logo-badge">
        <span>🧰</span> JISHENG OS · 应用集
      </div>
      <h1>万能超级工具箱</h1>
      <p class="subtitle">一站式访问所有实用网页工具，点击卡片立即使用</p>
      <div class="header-divider"></div>
    </header>

    <!-- 工具网格 -->
    <div class="tools-grid" id="toolsGrid">
      <!-- 所有工具卡片将通过 JS 动态生成，保证链接最新 -->
    </div>
  </div>

  <script>
    (function() {
      // 工具数据源 —— 严格对应仓库文件名称 (全部为 .html 文件)
      const tools = [
        {
          name: "Markdown 编辑器",
          file: "Markdown 编辑器.html",
          description: "沉浸式 Markdown 书写与实时预览，极简优雅。",
          icon: "📝",
          tag: "写作"
        },
        {
          name: "README.md 生成器",
          file: "README.md",
          description: "智能创建项目 README，开发文档一键生成。",
          icon: "📄",
          tag: "开发"
        },
        {
          name: "ZIP 时区修正",
          file: "ZIP时区修正.html",
          description: "批量修正 ZIP 内文件时区，高效准确。",
          icon: "🗂️",
          tag: "文件处理"
        },
        {
          name: "JISHENG 首页",
          file: "index.html",
          description: "主入口页面，快速导航至所有资源。",
          icon: "🏠",
          tag: "导航"
        },
        {
          name: "万能超级工具箱",
          file: "万能超级工具箱.html",
          description: "集成多种实用小工具，一站式解决杂项需求。",
          icon: "🧰",
          tag: "合集"
        },
        {
          name: "世界上最好的文字替换工具",
          file: "世界上最好的文字替换工具.html",
          description: "强大文字替换引擎，支持正则与批量处理。",
          icon: "🔁",
          tag: "文本"
        },
        {
          name: "差异对比工具",
          file: "差异对比工具.html",
          description: "高亮显示文本/代码差异，快速审阅变更。",
          icon: "⚖️",
          tag: "对比"
        },
        {
          name: "年度加薪申请系统",
          file: "年度加薪申请系统.html",
          description: "自动生成规范加薪申请，助力职场沟通。",
          icon: "💼",
          tag: "职场"
        },
        {
          name: "收藏夹对比同步工具",
          file: "收藏夹对比同步工具.html",
          description: "跨浏览器书签对比，同步去重一步到位。",
          icon: "⭐",
          tag: "同步"
        },
        {
          name: "文章多版本对比评审",
          file: "文章多版本对比评审.html",
          description: "多版本内容并行评审，注释与建议清晰。",
          icon: "🔍",
          tag: "审阅"
        },
        {
          name: "断发令",
          file: "断发令.html",
          description: "创意决策小工具，帮你果断断舍离。",
          icon: "✂️",
          tag: "趣味"
        },
        {
          name: "条漫阅",
          file: "条漫阅.html",
          description: "垂直漫画阅读器，流畅条漫体验。",
          icon: "📖",
          tag: "阅读"
        },
        {
          name: "移动端文字编辑",
          file: "移动端文字编辑.html",
          description: "专为触屏优化的文字编辑面板，简洁顺手。",
          icon: "📱",
          tag: "移动"
        },
        {
          name: "豪华时钟",
          file: "豪华时钟.html",
          description: "高颜值全屏时钟，多种主题与闹钟提醒。",
          icon: "🕒",
          tag: "时钟"
        }
      ];

      const grid = document.getElementById('toolsGrid');

      // 清空并动态生成卡片，确保链接正确指向相对路径
      function renderTools() {
        grid.innerHTML = ''; 
        tools.forEach(tool => {
          const card = document.createElement('a');
          card.className = 'tool-card';
          card.href = tool.file;  // 相对路径直接打开同目录文件
          card.setAttribute('aria-label', tool.name);
          
          // 内部结构
          card.innerHTML = `
            <div class="card-icon">${tool.icon}</div>
            <h3>${tool.name}</h3>
            <p>${tool.description}</p>
            <div class="tool-footer">
              <span class="tag">${tool.tag}</span>
              <span class="open-arrow">↗</span>
            </div>
          `;
          
          grid.appendChild(card);
        });
      }

      renderTools();
    })();
  </script>

  <!-- 简单回退：如果JS加载失败依然能看到静态提示，但已确保大部分环境动态生成 -->
  <noscript>
    <div style="text-align:center; padding:2rem; color:#cbd5e1; background:rgba(255,255,255,0.05); border-radius:1.5rem;">
      ⚡ 请启用 JavaScript 以查看完整的工具卡片导航。
    </div>
  </noscript>
</body>
</html>
